server {
    listen   80;

    root /usr/share/nginx/html;
    index index.html;

    server_name _;

    # index.html names the hashed bundles of the current build, so it must be
    # revalidated on every load - otherwise a browser may reuse a stale copy
    # after a deploy and request bundles that no longer exist (blank page).
    # "no-cache" still allows caching: nginx answers 304 when unchanged.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
