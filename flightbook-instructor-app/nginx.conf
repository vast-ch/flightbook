server {
    listen   80;

    root /usr/share/nginx/html;
    index index.html;

    server_name _;

    # Files whose URL does not change between builds must be revalidated on
    # every load. Without a Cache-Control header the browser applies heuristic
    # freshness (based on Last-Modified) and keeps serving its cached copy, so
    # a new build's hashed bundles would run against stale translations
    # (new i18n keys show up unresolved until the cache is cleared).
    # "no-cache" still allows caching - the browser just asks first and nginx
    # answers 304 Not Modified via ETag/Last-Modified when nothing changed.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/i18n/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
