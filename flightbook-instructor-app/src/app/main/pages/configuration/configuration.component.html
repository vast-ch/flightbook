<div class="fb-configuration-page">
  <header class="fb-config-header">
    <div class="fb-config-header__titles">
      <div class="fb-config-header__eyebrow">
        @if (school) {
          {{ school.name }}
        } @else {
          <span class="fb-skeleton fb-skeleton--text" style="width: 110px" aria-hidden="true"></span>
        }
      </div>
      <h1>{{ 'menu.configuration' | translate }}</h1>
    </div>
  </header>

  <div class="fb-config-grid">
    <fb-school-setting></fb-school-setting>
    <fb-team></fb-team>
  </div>

  <div class="fb-config-section">
    <fb-appointment-type></fb-appointment-type>
  </div>

  @if (school?.configuration?.tandemModule?.active) {
    <div class="fb-config-section">
      <fb-tandem-config></fb-tandem-config>
    </div>
  }
</div>
