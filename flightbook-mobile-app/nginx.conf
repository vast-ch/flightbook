server {
    listen   80;

    root /usr/share/nginx/html;
    index index.html;

    server_name _;

    # Never let a browser boot a build that no longer exists. index.html is the
    # only unhashed document that names the hashed bundles, and it ships with no
    # freshness information of its own, so a browser is free to reuse a stale
    # copy from its own cache on a cold start - and every script it names is
    # then gone from the server.
    location ~* ^/(index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
    }

    # A build artefact that isn't there must 404. Under the catch-all below it
    # would answer 200 with index.html instead, which a browser rejects as a
    # module script ("Expected a JavaScript-or-Wasm module script but the server
    # responded with a MIME type of text/html") - a blank page.
    #
    # This rule is also what retires the old service worker. The app no longer
    # ships one, but a registration outlives the code that created it: browsers
    # keep it until it is explicitly unregistered, and the spec does not treat a
    # 404 on the worker script as an unregistration (w3c/ServiceWorker#204,
    # closed wontfix). Angular's worker has its own escape hatch - on every
    # navigation it re-fetches /ngsw.json, and a 404 there makes it delete its
    # caches and unregister itself (ngsw-worker.js, fetchLatestManifest). Under
    # the catch-all it would get 200 + index.html instead, fail to parse it as
    # JSON, and survive. So the =404 below is what lets the old workers die.
    location ~* \.(?:js|css|json|webmanifest|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
