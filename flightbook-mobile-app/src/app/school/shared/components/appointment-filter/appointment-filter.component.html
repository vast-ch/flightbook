<!--
  No Cancel: the sheet edits the shared filter live, so the footer button and the
  backdrop both simply close it. Clear is the way back to an unfiltered list.
  Same grammar as the flight and statistics filter.
-->
<div class="filter-head">
  <div class="filter-head__grabber" aria-hidden="true"></div>
  <div class="filter-head__row">
    <h1 class="filter-head__title">{{ 'buttons.filter' | translate }}</h1>
    <button type="button" class="filter-head__clear" [class.is-enabled]="isFiltered()"
            [disabled]="!isFiltered()" (click)="clearFilter()">
      {{ 'buttons.clear' | translate }}
    </button>
  </div>
</div>

<ion-content class="filter-body">
  <div class="filter-scroll">

    <!-- Period -->
    <div class="fb-section-label">{{ 'filter.period' | translate }}</div>
    <div class="filter-dates">
      <button type="button" class="filter-date" id="appointmentFilterFrom">
        <span class="filter-date__label">{{ 'filter.from' | translate }}</span>
        <span class="filter-date__value" [class.is-placeholder]="!filter().from">
          {{ filter().from ? (filter().from | date:'dd.MM.yyyy') : '–' }}
        </span>
      </button>
      <button type="button" class="filter-date" id="appointmentFilterTo">
        <span class="filter-date__label">{{ 'filter.to' | translate }}</span>
        <span class="filter-date__value" [class.is-placeholder]="!filter().to">
          {{ filter().to ? (filter().to | date:'dd.MM.yyyy') : '–' }}
        </span>
      </button>
    </div>

    <!-- State: a chip row, as the flight filter draws its own short choices -->
    <div class="fb-section-label filter-label">{{ 'appointment.state' | translate }}</div>
    <div class="fb-chip-row filter-chips">
      @for (state of states; track state) {
        <button type="button" class="fb-chip" [class.fb-chip--active]="filter().state === state"
                (click)="setState(state)">
          {{ 'appointment.stateValue.' + (state || 'ALL') | translate }}
        </button>
      }
    </div>
  </div>
</ion-content>

<div class="form-footer">
  <ion-button expand="block" (click)="close()">{{ 'buttons.filter' | translate }}</ion-button>
</div>

<!--
  Trigger ids of this sheet's own, not the flight filter's: two sheets carrying
  the same id would each bind whichever button rendered first.
-->
<ion-modal class="filterDateModal dateModal" trigger="appointmentFilterFrom">
  <ng-template>
    <ion-datetime size="cover" presentation="date" [preferWheel]="true" locale="{{ language }}"
                  [showDefaultButtons]="true" doneText="{{ 'buttons.done' | translate }}"
                  cancelText="{{ 'buttons.clear' | translate }}"
                  (ionCancel)="clearDateButton('from')" (ionChange)="changeDate('from', $event)">
    </ion-datetime>
  </ng-template>
</ion-modal>

<ion-modal class="filterDateModal dateModal" trigger="appointmentFilterTo">
  <ng-template>
    <ion-datetime size="cover" presentation="date" [preferWheel]="true" locale="{{ language }}"
                  [showDefaultButtons]="true" doneText="{{ 'buttons.done' | translate }}"
                  cancelText="{{ 'buttons.clear' | translate }}"
                  (ionCancel)="clearDateButton('to')" (ionChange)="changeDate('to', $event)">
    </ion-datetime>
  </ng-template>
</ion-modal>
