<!--
  No Cancel: the sheet edits the shared filter live, so the footer button and the
  backdrop both simply close it. Clear is the way back to an unfiltered list.
  Same grammar as the flight and appointment filter.
-->
<div class="filter-head">
    <div class="filter-head__grabber" aria-hidden="true"></div>
    <div class="filter-head__row">
        <h1 class="filter-head__title">{{ 'buttons.filter' | translate }}</h1>
        <button type="button" class="filter-head__clear" [class.is-enabled]="isFiltered()"
                [disabled]="!isFiltered()" (click)="clearFilter()">
            {{ 'buttons.clear' | translate }}
        </button>
    </div>
</div>

<ion-content class="filter-body">
    <div class="filter-scroll">

        <!-- Brand: boxed dropdown, same pattern as flight-filter's glider select -->
        <div class="fb-section-label">{{ 'glider.brand' | translate }}</div>
        <div class="filter-select">
            <ion-select [ngModel]="filter().brand" (ngModelChange)="setBrand($event)"
                        name="brand" toggleIcon="chevron-forward"
                        [attr.aria-label]="'glider.brand' | translate"
                        okText="{{ 'buttons.done' | translate }}"
                        cancelText="{{ 'buttons.clear' | translate }}"
                        (ionCancel)="setBrand('')">
                <ion-select-option value="">{{ 'glider.all' | translate }}</ion-select-option>
                @for (brand of brands(); track brand) {
                    <ion-select-option [value]="brand">{{ brand }}</ion-select-option>
                }
            </ion-select>
        </div>

        <!-- Name: boxed text field -->
        <div class="fb-section-label filter-label">{{ 'glider.name' | translate }}</div>
        <div class="filter-name">
            <ion-input [ngModel]="filter().name" (ngModelChange)="setName($event)"
                       name="name" type="text"
                       [attr.aria-label]="'glider.name' | translate"></ion-input>
        </div>

        <!-- Type: chip row -->
        <div class="fb-section-label filter-label">{{ 'glider.type' | translate }}</div>
        <div class="fb-chip-row filter-chips">
            <button type="button" class="fb-chip" [class.fb-chip--active]="!filter().type"
                    (click)="setType('')">{{ 'glider.all' | translate }}</button>
            <button type="button" class="fb-chip" [class.fb-chip--active]="filter().type === '0'"
                    (click)="setType('0')">{{ 'glider.solo' | translate }}</button>
            <button type="button" class="fb-chip" [class.fb-chip--active]="filter().type === '1'"
                    (click)="setType('1')">{{ 'glider.tandem' | translate }}</button>
        </div>

        <!-- Archived: chip row -->
        <div class="fb-section-label filter-label">{{ 'glider.archived' | translate }}</div>
        <div class="fb-chip-row filter-chips">
            <button type="button" class="fb-chip" [class.fb-chip--active]="!filter().archived"
                    (click)="setArchived('')">{{ 'glider.all' | translate }}</button>
            <button type="button" class="fb-chip" [class.fb-chip--active]="filter().archived === '1'"
                    (click)="setArchived('1')">{{ 'buttons.yes' | translate }}</button>
            <button type="button" class="fb-chip" [class.fb-chip--active]="filter().archived === '0'"
                    (click)="setArchived('0')">{{ 'buttons.no' | translate }}</button>
        </div>
    </div>
</ion-content>

<div class="form-footer">
    <ion-button expand="block" (click)="close()">{{ 'buttons.filter' | translate }}</ion-button>
</div>
