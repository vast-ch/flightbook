@if (igcFileValue) {
  <div class="map-frame">
    <div #mapEl class="igc-map"></div>

    <!-- Diverging vario ramp: blue sink, gray neutral, red climb -->
    <div class="legend" role="img"
         [attr.aria-label]="'flight.vario.legendLabel' | translate">
      <div class="legend__swatches">
        @for (bin of varioBins; track bin.color) {
          <span class="legend__swatch" [style.background]="bin.color"></span>
        }
      </div>
      <div class="legend__scale">
        <span>&minus;3</span>
        <span>0</span>
        <span>+3</span>
        <span class="legend__unit">m/s</span>
      </div>
    </div>

    <!-- Readout tracks the marker while scrubbing or replaying -->
    @if (sliderInfo && inputValue > 0) {
      <div class="readout">
        <span class="readout__time">{{ sliderInfo.time }} UTC</span>
        @if (sliderInfo.gpsAltitude !== null || sliderInfo.pressureAltitude !== null) {
          <span class="readout__alt">{{ sliderInfo.pressureAltitude ?? sliderInfo.gpsAltitude }} m</span>
        }
      </div>
    }
  </div>

  <div class="playback">
    <ion-button fill="clear" class="playback__button" (click)="togglePlay()"
                [attr.aria-label]="(playing ? 'buttons.pause' : 'buttons.play') | translate">
      <ion-icon slot="icon-only" [name]="playing ? 'pause' : 'play'"></ion-icon>
    </ion-button>
    <ion-range class="playback__range" min="0" max="100" step="0.1"
               [value]="inputValue * 100"
               (ionKnobMoveStart)="onKnobMoveStart()"
               (ionInput)="onTimeSliderInput($event)"
               [attr.aria-label]="'flight.vario.scrubLabel' | translate"></ion-range>
  </div>
}
