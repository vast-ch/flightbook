<!--
  No back or close affordance in the header: a forced update has nothing to
  close to - the guard has already refused the route behind this - and an
  optional one is dismissed by its own "later" button.
-->
<div class="form-header">
  <h1 class="form-header__title">{{ 'update.title' | translate }}</h1>
</div>

<ion-content>
  <div class="form-body update-body">
    <div class="update-icon" [class.is-forced]="isForceUpdate" aria-hidden="true">
      <ion-icon [name]="isForceUpdate ? 'alert-circle' : 'information-circle'"></ion-icon>
    </div>

    <p class="update-message">{{ updateInfo?.message }}</p>
  </div>
</ion-content>

<ion-footer class="form-footer update-footer">
  <ion-button expand="block" [color]="isForceUpdate ? 'danger' : 'primary'" (click)="updateNow()">
    {{ 'update.updateNow' | translate }}
  </ion-button>

  @if (isOptionalUpdate) {
    <ion-button expand="block" fill="clear" (click)="dismiss()">
      {{ 'update.later' | translate }}
    </ion-button>
  }
</ion-footer>
