<ion-content class="login-content">
  <div class="login">

    <div class="login__body">
      <div class="brand">
        <img src="assets/icons/icon-512x512.png" alt="Flightbook" class="brand__mark" />
        <h1 class="brand__name">Flightbook</h1>
        <p class="brand__tagline">{{ 'login.tagline' | translate }}</p>
      </div>

      <form id="loginForm" #form="ngForm" (ngSubmit)="login(form)">
        <div class="fb-card--flush credentials">
          <div class="fb-field">
            <label class="fb-field__label" id="lbl-loginEmail" for="loginEmail">{{ 'login.email' | translate }}</label>
            <ion-input id="loginEmail" aria-labelledby="lbl-loginEmail" [(ngModel)]="loginData.email" name="email" required
                       type="email" inputmode="email" autocomplete="email"
                       enterkeyhint="next"></ion-input>
          </div>

          <div class="fb-field fb-field--split">
            <div class="fb-field__main">
              <label class="fb-field__label" id="lbl-loginPassword" for="loginPassword">{{ 'login.password' | translate }}</label>
              <ion-input id="loginPassword" aria-labelledby="lbl-loginPassword" [(ngModel)]="loginData.password" name="password" required
                         [type]="showPassword ? 'text' : 'password'"
                         autocomplete="current-password" enterkeyhint="go"></ion-input>
            </div>
            <!--
              Own toggle rather than ion-input-password-toggle: that control is
              shadow DOM with no exposed parts, so its 48px round button cannot
              be resized to the design, and its aria-label is hardcoded English.
            -->
            <button type="button" class="credentials__reveal" (click)="togglePassword()"
                    [attr.aria-label]="(showPassword ? 'login.hidePassword' : 'login.showPassword') | translate"
                    [attr.aria-pressed]="showPassword">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
            </button>
          </div>
        </div>

        <ion-button class="login__primary" expand="block" type="submit">
          {{ 'buttons.login' | translate }}
        </ion-button>
      </form>

      <ion-button class="login__secondary" expand="block" fill="outline" (click)="register()">
        {{ 'buttons.createAccount' | translate }}
      </ion-button>

      <button type="button" class="login__forgot" (click)="forgotPassword()">
        {{ 'login.passwordlost' | translate }}
      </button>
    </div>

    <div class="login__footer">
      <!-- Active language is finally visible; the old link row gave no indication -->
      <div class="languages" role="group" [attr.aria-label]="'login.language' | translate">
        @for (lang of languages; track lang) {
          <button type="button" class="languages__item"
                  [class.is-active]="lang === currentLang"
                  [attr.aria-pressed]="lang === currentLang"
                  (click)="setLanguage(lang)">
            {{ lang | uppercase }}
          </button>
        }
      </div>
      <p class="login__version">Flightbook {{ version }}</p>
    </div>

  </div>
</ion-content>
