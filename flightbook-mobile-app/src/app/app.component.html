<!--
  No side menu: every destination it held is reachable from the tab bar or the
  More page, so the shell is just the routed outlet now.
-->
<ion-app>
  <ion-router-outlet (activate)="subscribeToEmmiter($event)" id="main-content"></ion-router-outlet>

  <!-- Covers the router's boot decision; see AppComponent.bootVisible -->
  @if (bootVisible()) {
    <fb-loading-screen></fb-loading-screen>
  }
</ion-app>
